<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Year Fortune Distribution Event</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: url('https://i.imgur.com/w9qQ8ZB.jpeg') center/cover no-repeat fixed;
        font-family: Arial, sans-serif;
    }

    /* Tiêu đề */
    #title {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        font-size: 48px;
        font-weight: bold;
        color: red;
        text-shadow: 0 0 20px gold, 0 0 40px yellow;
    }

    /* Con lân */
    #lion {
        position: absolute;
        bottom: 50px;
        left: -200px;
        width: 250px;
        filter: drop-shadow(0 0 10px yellow);
        animation: moveLion 10s linear infinite;
    }

    @keyframes moveLion {
        0% { left: -200px; }
        50% { left: calc(100% - 200px); }
        100% { left: -200px; }
    }

    /* Bao lì xì */
    .lixi {
        position: absolute;
        width: 90px;
        cursor: pointer;
        transform: rotate(0deg);
        animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
        from { transform: rotate(0); }
        to { transform: rotate(360deg); }
    }

    /* Hoa mai rơi */
    .flower {
        position: absolute;
        width: 30px;
        animation: fall 5s linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
    }

    /* Nút */
    #controls {
        position: absolute;
        bottom: 20px;
        left: 20px;
    }

    button {
        padding: 10px 20px;
        margin-right: 10px;
        border: none;
        border-radius: 8px;
        background: red;
        color: yellow;
        font-size: 18px;
        cursor: pointer;
    }
</style>
</head>

<body>
    <div id="title">🎉 New Year Fortune Distribution Event 🎉</div>

    <!-- Con lân -->
    <img id="lion" src="lion-new.png" class="lion"> 
    <div id="controls">
        <button onclick="toggleMusic()">Play Music</button>
        <button onclick="spawnLixi()">Play Again</button>
    </div>

    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2023/01/06/audio_379b36cbe3.mp3?filename=chinese-new-year-134277.mp3" type="audio/mpeg" />
    </audio>

<script>
//====================================================
// TỶ LỆ RANDOM BAO LÌ XÌ
//====================================================
const rewards = [
    { amount: 2500, weight: 5 },
    { amount: 1000, weight: 10 },
    { amount: 800, weight: 20 },
    { amount: 600, weight: 25 },
    { amount: 500, weight: 30 },
    { amount: "Next time", weight: 10 }
];

function weightedRandom() {
    let total = rewards.reduce((s, r) => s + r.weight, 0);
    let rnd = Math.random() * total;

    for (let r of rewards) {
        if (rnd < r.weight) return r.amount;
        rnd -= r.weight;
    }
}

//====================================================
// PHÁT BAO LÌ XÌ + HIỆU ỨNG
//====================================================
function spawnLixi() {
    for (let i = 0; i < 6; i++) {
        let lixi = document.createElement('img');
        lixi.src = `https://i.imgur.com/5G8bY2M.png`;
        lixi.className = 'lixi';
        lixi.style.left = (200 + Math.random() * 900) + 'px';
        lixi.style.top = (80 + Math.random() * 200) + 'px';

        lixi.onclick = function () {
            let reward = weightedRandom();
            alert("Bạn nhận được: " + reward + " Naira");
            showFireworks();
            this.remove();
        };

        document.body.appendChild(lixi);
    }
}

//====================================================
// HOA MAI RƠI
//====================================================
setInterval(() => {
    let fl = document.createElement('img');
    fl.src = "https://i.imgur.com/nxv1yYF.png";
    fl.className = 'flower';
    fl.style.left = Math.random() * 100 + 'vw';
    fl.style.animationDuration = (4 + Math.random() * 4) + 's';
    document.body.appendChild(fl);
    setTimeout(() => fl.remove(), 6000);
}, 400);

//====================================================
// PHÁO HOA
//====================================================
function showFireworks() {
    for (let i = 0; i < 20; i++) {
        let f = document.createElement('div');
        f.style.position = 'absolute';
        f.style.width = '10px';
        f.style.height = '10px';
        f.style.borderRadius = '50%';
        f.style.background = 'gold';
        f.style.left = (event.pageX - 5) + 'px';
        f.style.top = (event.pageY - 5) + 'px';
        f.style.transition = '1s';
        document.body.appendChild(f);

        setTimeout(() => {
            f.style.transform = `translate(${(Math.random()-0.5)*300}px, ${(Math.random()-0.5)*300}px)`;
            f.style.opacity = 0;
        }, 50);

        setTimeout(() => f.remove(), 1100);
    }
}

//====================================================
// NHẠC NỀN
//====================================================
function toggleMusic() {
    let bgm = document.getElementById('bgm');
    if (bgm.paused) bgm.play(); else bgm.pause();
}
</script>
</body>
</html>
